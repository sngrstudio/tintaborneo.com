image: gitpod/workspace-bun

tasks:
  - init: |
      echo "ADMIN_ENDPOINT=${ADMIN_ENDPOINT}" > .env
      bun install
    command: |
      echo "Run \"bun dev\" to start dev server"

vscode:
  extensions:
    - astro-build.astro-vscode
    - bradlc.vscode-tailwindcss
    - GitHub.vscode-github-actions
    - sourcegraph.cody-ai
