on:
  workflow_dispatch:
  schedule:
    - cron: 5 0 * * *

jobs:
  archive:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sitemaps:
          - 'https://www.tintaborneo.com/pages-sitemap.xml'
          - 'https://www.tintaborneo.com/news-sitemap.xml'
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.4'
      - run: gem install wayback_archiver
      - run: wayback_archiver ${{ matrix.sitemaps }}
